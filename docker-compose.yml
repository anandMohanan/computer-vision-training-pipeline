services:
  postgres:
    image: postgres:16
    container_name: yolo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yolo
      POSTGRES_PASSWORD: yolo_dev_password
      POSTGRES_DB: yolo_pipeline
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yolo -d yolo_pipeline"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: yolo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: yolo-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb --ignore-existing local/yolo-samples &&
      mc anonymous set private local/yolo-samples
      "
    restart: "no"

  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: yolo-label-studio
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - label_studio_data:/label-studio/data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  label-studio-yolo-ml:
    image: heartexlabs/label-studio-ml-backend:yolo-master
    container_name: yolo-label-studio-yolo-ml
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      LABEL_STUDIO_URL: http://label-studio:8080
      LOG_LEVEL: INFO
      ALLOW_CUSTOM_MODEL_PATH: "true"
    ports:
      - "9090:9090"
    volumes:
      - ./models:/app/models
    depends_on:
      - label-studio

volumes:
  postgres_data:
  minio_data:
  label_studio_data:
